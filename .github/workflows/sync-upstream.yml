name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Upstream repo in owner/name format
        required: true
        default: w2599/Dopamine
      sync_releases:
        description: Mirror upstream releases and assets
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_repo || 'w2599/Dopamine' }}
      SYNC_RELEASES: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_releases }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve upstream default branch
        shell: bash
        run: |
          set -euo pipefail
          upstream_branch="$(gh api "repos/${UPSTREAM_REPO}" --jq '.default_branch')"
          echo "UPSTREAM_BRANCH=${upstream_branch}" >> "$GITHUB_ENV"
          echo "Resolved upstream branch: ${upstream_branch}"

      - name: Merge upstream branch
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --tags --force
          git checkout "${TARGET_BRANCH}"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}" || {
            echo "Automatic merge failed. Manual conflict resolution required."
            exit 1
          }
          git push origin "${TARGET_BRANCH}"

      - name: Sync upstream tags
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags upstream | awk '{print $2}' | sed 's#^refs/tags/##' | sed 's/\^{}$//' | sort -u | while read -r tag; do
            [ -n "${tag}" ] || continue
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              continue
            fi
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          done

      - name: Mirror upstream releases
        if: ${{ env.SYNC_RELEASES == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'github-actions-release-sync'
          }

          function Download-WithRetry {
            param(
              [string]$Url,
              [string]$OutFile,
              [hashtable]$Headers,
              [int]$MaxAttempts = 4
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                Invoke-WebRequest -Headers $Headers -Uri $Url -OutFile $OutFile
                return
              } catch {
                if ($attempt -eq $MaxAttempts) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }

          $tmpRoot = Join-Path $env:RUNNER_TEMP ('release-sync-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $tmpRoot | Out-Null

          try {
            $srcRepo = $env:UPSTREAM_REPO
            $dstRepo = $env:GITHUB_REPOSITORY

            $srcReleases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$srcRepo/releases?per_page=100" -Method Get
            $dstReleases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$dstRepo/releases?per_page=100" -Method Get

            $existingTags = @{}
            foreach ($release in $dstReleases) {
              $existingTags[$release.tag_name] = $true
            }

            foreach ($release in $srcReleases) {
              $tag = $release.tag_name
              $name = if ($null -ne $release.name -and $release.name -ne '') { $release.name } else { $tag }

              if ($existingTags.ContainsKey($tag)) {
                $targetRelease = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$dstRepo/releases/tags/$tag" -Method Get
              } else {
                $payload = @{
                  tag_name = $tag
                  name = $name
                  body = if ($null -ne $release.body) { [string]$release.body } else { '' }
                  draft = [bool]$release.draft
                  prerelease = [bool]$release.prerelease
                  generate_release_notes = $false
                } | ConvertTo-Json -Depth 10

                $targetRelease = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$dstRepo/releases" -Method Post -Body $payload -ContentType 'application/json'
                $existingTags[$tag] = $true
              }

              if (-not $release.assets -or $release.assets.Count -eq 0) {
                continue
              }

              $targetAssets = @{}
              foreach ($asset in $targetRelease.assets) {
                $targetAssets[$asset.name] = $true
              }

              $assetDir = Join-Path $tmpRoot $tag
              New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

              foreach ($asset in $release.assets) {
                if ($targetAssets.ContainsKey($asset.name)) {
                  continue
                }

                $assetPath = Join-Path $assetDir $asset.name
                Download-WithRetry -Url $asset.browser_download_url -OutFile $assetPath -Headers $headers

                $uploadUrl = $targetRelease.upload_url -replace '\{\?name,label\}', ('?name=' + [uri]::EscapeDataString($asset.name))
                Invoke-RestMethod -Headers $headers -Uri $uploadUrl -Method Post -InFile $assetPath -ContentType 'application/octet-stream' | Out-Null

                Remove-Item -LiteralPath $assetPath -Force
              }
            }
          } finally {
            if (Test-Path $tmpRoot) {
              Remove-Item -LiteralPath $tmpRoot -Recurse -Force
            }
          }
